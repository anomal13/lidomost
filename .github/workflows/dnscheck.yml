name: dnscheck
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          echo "== egress IP"; curl -s https://api.ipify.org; echo
          for ns in ns1.reg.ru ns2.reg.ru; do
            echo "== $ns A"; dig @$ns lidomost.ru A +norec +time=5 +tries=2 | grep -E "status|flags|^lidomost|timed out|no servers" || true
            echo "== $ns CAA"; dig @$ns lidomost.ru CAA +norec +time=5 +tries=2 | grep -E "status|flags|timed out|no servers" || true
          done
          echo "== system resolver"; dig lidomost.ru A +time=5 | grep -E "status|^lidomost" || true
          echo "== system resolver CAA"; dig lidomost.ru CAA +time=5 | grep -E "status" || true
          echo "== trace tail"; dig +trace lidomost.ru A 2>&1 | tail -8
